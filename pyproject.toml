[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

# Optional provider SDKs — install only the ones you need.
# See README.md § "Custom API Keys" for details.
[project.optional-dependencies]
openai     = ["openai>=1.0.0"]
anthropic  = ["anthropic>=0.20.0"]
google     = ["google-generativeai>=0.5.0"]
groq       = ["groq>=0.11.0"]
# Install all provider SDKs at once:  uv sync --extra all-providers
all-providers = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.5.0",
    "groq>=0.11.0",
]
